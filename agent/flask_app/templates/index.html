<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Form</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
      background: linear-gradient(160deg, #e8f0e9 0%, #f5f7f2 50%, #dfe8e3 100%);
      min-height: 100vh;
      color: #1a2e1f;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border: 1px solid #7a9a82;
      background: #fff;
      font-size: 1rem;
    }
    button {
      padding: 0.65rem 1.1rem;
      border: 1px solid #2d5a3a;
      background: #2d5a3a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1f4030;
    }
    .output {
      padding: 1rem 0;
      border-top: 1px solid #a8c0ae;
      font-size: 1.1rem;
    }
    .label {
      color: #4a6b52;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <h1>Simple Form</h1>
  <form method="POST" action="/">
    <input type="text" name="message" placeholder="Type something..." required autofocus>
    <button type="submit">Submit</button>
  </form>
  {% if message %}
  <div class="output">
    <div class="label">You submitted:</div>
    <div>{{ message }}</div>
  </div>
  {% endif %}
</body>
</html>
